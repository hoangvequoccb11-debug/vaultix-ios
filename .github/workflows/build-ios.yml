name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          npm install -g @capacitor/cli

      - name: Initialize Capacitor Project
        run: |
          mkdir www
          cp index.html www/
          npx cap init "Vaultix Pro" "com.hoangvequoc.vaultixpro" --web-dir www
          npx cap add ios
          npx cap sync ios

      - name: Build Xcode Project
        run: |
          cd ios/App
          xcodebuild clean build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload into IPA
        run: |
          cd ios/App
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/App.app build/Payload/
          cd build
          zip -r VaultixPro.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultixPro-IPA
          path: ios/App/build/VaultixPro.ipa

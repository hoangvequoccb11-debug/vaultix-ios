<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vaultix Pro</title>
    
    <!-- Cấu hình App Icon và Màn hình cho iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vaultix">
    
    <!-- Biểu tượng ứng dụng trên màn hình chính (App Icon) -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/10552/10552277.png">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/10552/10552277.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        /* Splash Screen Animation */
        #splash-screen { transition: opacity 0.5s ease-out; }
        .hide-splash { opacity: 0; pointer-events: none; }
        /* Ẩn thanh cuộn nhưng vẫn cuộn được */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 pb-28">

    <!-- Màn hình khởi động (Splash Screen) -->
    <div id="splash-screen" class="fixed inset-0 bg-slate-950 z-[100] flex flex-col items-center justify-center">
        <div class="w-20 h-20 rounded-3xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-black text-white text-4xl shadow-2xl shadow-blue-500/50 mb-4 animate-bounce">V</div>
        <h1 class="text-2xl font-extrabold tracking-widest text-white">VAULTIX PRO</h1>
        <p class="text-sm text-slate-400 mt-2">Loading data...</p>
    </div>

    <!-- Header -->
    <header class="bg-slate-900/90 backdrop-blur-xl border-b border-slate-800 p-4 pt-12 sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-black text-white text-base shadow-lg shadow-blue-500/30">V</div>
                <div>
                    <h1 class="text-sm font-extrabold tracking-wider text-white">VAULTIX PRO</h1>
                    <p class="text-[10px] text-slate-400 font-medium">Hệ thống Quản lý Tài chính</p>
                </div>
            </div>
            <span id="currentDateHeader" class="text-xs bg-slate-800 text-blue-400 font-bold px-3 py-1.5 rounded-xl border border-slate-700/60 shadow-inner"></span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-5">

        <!-- Tổng quan số dư -->
        <div class="bg-gradient-to-br from-blue-600 via-indigo-600 to-violet-800 text-white p-5 rounded-3xl shadow-2xl shadow-indigo-600/20 space-y-3 relative overflow-hidden border border-white/10">
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
            <div class="flex justify-between items-center relative z-10">
                <p class="text-xs text-blue-200 uppercase font-bold tracking-widest">Tổng Tài Sản Ròng</p>
                <button onclick="togglePrivacy()" class="text-white/70 hover:text-white p-1"><i id="privacyIcon" class="fa-solid fa-eye"></i></button>
            </div>
            <h2 id="totalBalance" class="text-3xl font-black mt-1 tracking-tight relative z-10">0 đ</h2>
            
            <div class="grid grid-cols-2 gap-3 pt-3 border-t border-white/15 text-sm relative z-10">
                <div class="bg-black/20 p-2.5 rounded-2xl backdrop-blur-md border border-white/5">
                    <span class="text-xs text-emerald-300 font-semibold block mb-0.5"><i class="fa-solid fa-arrow-down mr-1"></i>Tổng Thu Vào</span>
                    <p id="totalIncome" class="font-black text-white money-text">0 đ</p>
                </div>
                <div class="bg-black/20 p-2.5 rounded-2xl backdrop-blur-md border border-white/5">
                    <span class="text-xs text-rose-300 font-semibold block mb-0.5"><i class="fa-solid fa-arrow-up mr-1"></i>Tổng Chi Ra</span>
                    <p id="totalExpense" class="font-black text-white money-text">0 đ</p>
                </div>
            </div>
        </div>

        <!-- Các Tab Nội dung chính -->
        <div id="content-area">
            
            <!-- PHẦN 1: THU CHI -->
            <div id="section-transactions" class="space-y-4">
                <div class="flex justify-between items-center bg-slate-900 p-2.5 rounded-2xl border border-slate-800 text-xs shadow-sm">
                    <span class="text-slate-400 font-semibold pl-2"><i class="fa-solid fa-calendar-days mr-1.5 text-blue-400"></i>Kỳ báo cáo:</span>
                    <select id="filterMonthVN" onchange="renderTransactions()" class="bg-slate-800 text-blue-300 font-bold px-3 py-1.5 rounded-xl outline-none border border-slate-700"></select>
                </div>

                <div class="bg-slate-900 p-4 rounded-3xl shadow-lg border border-slate-800 space-y-3">
                    <h3 class="text-sm font-bold text-slate-200 flex items-center"><i class="fa-solid fa-circle-plus mr-2 text-blue-500"></i>Ghi Chép Giao Dịch</h3>
                    <form id="txForm" onsubmit="addTransaction(event)" class="space-y-3">
                        <div class="grid grid-cols-2 gap-2">
                            <select id="txType" class="w-full p-3 text-sm bg-slate-950 border border-slate-800 rounded-2xl text-slate-200 font-semibold outline-none">
                                <option value="income">Tiền Vào (Thu)</option>
                                <option value="expense">Tiền Ra (Chi)</option>
                            </select>
                            <input type="number" id="txAmount" placeholder="Số tiền (đ)" required class="w-full p-3 text-sm bg-slate-950 border border-slate-800 rounded-2xl text-slate-200 font-semibold outline-none">
                        </div>
                        <input type="text" id="txSource" placeholder="Nguồn tiền / Danh mục chi tiêu..." required class="w-full p-3 text-sm bg-slate-950 border border-slate-800 rounded-2xl text-slate-200 outline-none">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="date" id="txDate" required class="w-full p-3 text-sm bg-slate-950 border border-slate-800 rounded-2xl text-slate-200 font-medium outline-none">
                            <input type="text" id="txNote" placeholder="Ghi chú..." class="w-full p-3 text-sm bg-slate-950 border border-slate-800 rounded-2xl text-slate-200 outline-none">
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold p-3.5 rounded-2xl text-sm shadow-lg shadow-blue-600/30 transition">Lưu Giao Dịch</button>
                    </form>
                </div>

                <div class="space-y-2">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-1">Lịch sử giao dịch</h3>
                    <div id="txList" class="space-y-2"></div>
                </div>
            </div>

            <!-- PHẦN 2: CÔNG NỢ -->
            <div id="section-debts" class="space-y-4 hidden">
                <div class="bg-slate-900 p-4 rounded-3xl shadow-lg border border-slate-800 space-y-3">
                    <h3 class="text-sm font-bold text-slate-200 flex items-center"><i class="fa-solid fa-handshake mr-2 text-amber-500"></i>Quản Lý Công Nợ (+ Ảnh Bill)</h3>
                    <form id="debtForm" onsubmit="addDebt(event)" class="space-y-3">
                        <div class="grid grid-cols-2 gap-2">
                            <select id="debtType" class="w-full p-3 text-sm bg-slate-950 border border-slate-800 rounded-2xl text-slate-200 font-semibold outline-none">
                                <option value="lent">Mình cho mượn</option>
                                <option value="borrowed">Mình đi mượn</option>
                            </select>
                            <input type="number" id="debtAmount" placeholder="Số tiền (đ)" required class="w-full p-3 text-sm bg-slate-950 border border-slate-800 rounded-2xl text-slate-200 font-semibold outline-none">
                        </div>
                        <input type="text" id="debtPerson" placeholder="Tên người mượn / Người trả..." required class="w-full p-3 text-sm bg-slate-950 border border-slate-800 rounded-2xl text-slate-200 outline-none">
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <div class="bg-slate-950 p-2.5 border border-slate-800 rounded-2xl">
                                <label class="block text-slate-400 font-medium mb-1">Ngày mượn</label>
                                <input type="date" id="debtStartDate" required class="w-full bg-transparent text-sm font-semibold text-slate-200 outline-none">
                            </div>
                            <div class="bg-slate-950 p-2.5 border border-slate-800 rounded-2xl">
                                <label class="block text-slate-400 font-medium mb-1">Ngày hẹn trả</label>
                                <input type="date" id="debtDueDate" required class="w-full bg-transparent text-sm font-semibold text-rose-400 outline-none">
                            </div>
                        </div>
                        <div class="bg-slate-950 p-3 border border-slate-800 rounded-2xl space-y-1.5">
                            <label class="block text-xs font-semibold text-slate-300"><i class="fa-solid fa-image mr-1 text-blue-400"></i>Tải lên ảnh bằng chứng:</label>
                            <input type="file" id="debtImage" accept="image/*" class="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:bg-slate-800 file:text-blue-400">
                        </div>
                        <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold p-3.5 rounded-2xl text-sm shadow-lg shadow-amber-600/30 transition">Lưu Khoản Nợ</button>
                    </form>
                </div>
                
                <div class="space-y-4">
                    <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider px-1"><i class="fa-solid fa-clock mr-1"></i>Đang Nợ (Chưa Trả)</h3>
                    <div id="activeDebtList" class="space-y-2"></div>
                    
                    <h3 class="text-xs font-bold text-emerald-400 uppercase tracking-wider px-1 pt-2"><i class="fa-solid fa-check-circle mr-1"></i>Đã Hoàn Tất</h3>
                    <div id="completedDebtList" class="space-y-2"></div>
                </div>
            </div>

            <!-- PHẦN 3: MỤC TIÊU TIẾT KIỆM -->
            <div id="section-savings" class="space-y-4 hidden">
                <div class="bg-slate-900 p-4 rounded-3xl shadow-lg border border-slate-800 space-y-3">
                    <h3 class="text-sm font-bold text-slate-200 flex items-center"><i class="fa-solid fa-piggy-bank mr-2 text-emerald-500"></i>Mục Tiêu Tiết Kiệm</h3>
                    <form id="savingForm" onsubmit="addSavingGoal(event)" class="space-y-3">
                        <input type="text" id="goalName" placeholder="Tên mục tiêu..." required class="w-full p-3 text-sm bg-slate-950 border border-slate-800 rounded-2xl text-slate-200 outline-none">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" id="goalTarget" placeholder="Cần đạt (đ)" required class="w-full p-3 text-sm bg-slate-950 border border-slate-800 rounded-2xl text-slate-200 font-semibold outline-none">
                            <input type="number" id="goalCurrent" placeholder="Đã có (đ)" value="0" required class="w-full p-3 text-sm bg-slate-950 border border-slate-800 rounded-2xl text-slate-200 font-semibold outline-none">
                        </div>
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold p-3.5 rounded-2xl text-sm shadow-lg shadow-emerald-600/30 transition">Lưu Mục Tiêu</button>
                    </form>
                </div>
                <div id="savingList" class="space-y-2"></div>
            </div>

            <!-- PHẦN 4: CÀI ĐẶT & SAO LƯU -->
            <div id="section-settings" class="space-y-4 hidden">
                <div class="bg-slate-900 p-5 rounded-3xl shadow-lg border border-slate-800 space-y-5">
                    <h3 class="text-sm font-bold text-slate-200 flex items-center"><i class="fa-solid fa-shield-halved mr-2 text-blue-500"></i>Quản Lý Dữ Liệu</h3>
                    
                    <div class="space-y-3">
                        <button onclick="exportBackupData()" class="w-full bg-blue-600/20 border border-blue-500/30 text-blue-400 font-bold p-3.5 rounded-2xl text-sm flex items-center justify-center hover:bg-blue-600/30 transition">
                            <i class="fa-solid fa-download mr-2"></i> Xuất file Backup Dữ Liệu
                        </button>
                        
                        <label class="w-full bg-slate-800 border border-slate-700 text-slate-300 font-bold p-3.5 rounded-2xl text-sm flex items-center justify-center cursor-pointer hover:bg-slate-700 transition">
                            <i class="fa-solid fa-upload mr-2"></i> Nhập file Khôi phục Dữ Liệu
                            <input type="file" id="importFile" accept=".json" class="hidden" onchange="importBackupData(event)">
                        </label>
                    </div>

                    <div class="pt-4 border-t border-slate-800/80">
                        <button onclick="clearAllData()" class="w-full bg-rose-500/10 border border-rose-500/30 text-rose-500 font-bold p-3.5 rounded-2xl text-sm hover:bg-rose-500/20 transition">
                            <i class="fa-solid fa-triangle-exclamation mr-2"></i> Xóa Toàn Bộ Dữ Liệu App
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- THANH ĐIỀU HƯỚNG DƯỚI (BOTTOM NAVIGATION BAR) -->
    <nav class="fixed bottom-0 w-full max-w-md left-1/2 -translate-x-1/2 bg-slate-900/95 backdrop-blur-xl border-t border-slate-800 flex justify-around items-center pt-3 pb-8 px-2 z-50 rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.3)]">
        <button onclick="switchTab('transactions')" id="nav-transactions" class="flex flex-col items-center p-2 text-blue-500 transition-colors w-16">
            <i class="fa-solid fa-wallet text-xl mb-1"></i>
            <span class="text-[10px] font-bold">Thu Chi</span>
        </button>
        <button onclick="switchTab('debts')" id="nav-debts" class="flex flex-col items-center p-2 text-slate-500 hover:text-amber-400 transition-colors w-16">
            <i class="fa-solid fa-handshake text-xl mb-1"></i>
            <span class="text-[10px] font-bold">Công Nợ</span>
        </button>
        <button onclick="switchTab('savings')" id="nav-savings" class="flex flex-col items-center p-2 text-slate-500 hover:text-emerald-400 transition-colors w-16">
            <i class="fa-solid fa-bullseye text-xl mb-1"></i>
            <span class="text-[10px] font-bold">Mục Tiêu</span>
        </button>
        <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center p-2 text-slate-500 hover:text-purple-400 transition-colors w-16">
            <i class="fa-solid fa-gear text-xl mb-1"></i>
            <span class="text-[10px] font-bold">Cài Đặt</span>
        </button>
    </nav>

    <!-- Modal xem ảnh -->
    <div id="imageModal" class="fixed inset-0 bg-black/95 z-[100] hidden flex items-center justify-center p-4" onclick="closeImageModal()">
        <img id="modalImg" class="max-h-[85vh] max-w-full rounded-2xl object-contain border border-slate-800">
    </div>

    <script>
        // Data State
        let transactions = JSON.parse(localStorage.getItem('vpro_tx')) || [];
        let debts = JSON.parse(localStorage.getItem('vpro_debts')) || [];
        let savings = JSON.parse(localStorage.getItem('vpro_savings')) || [];
        let isPrivate = localStorage.getItem('vpro_privacy') === 'true';

        // Splash Screen Effect
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('splash-screen').classList.add('hide-splash');
            }, 1200);
        };

        const today = new Date();
        document.getElementById('currentDateHeader').innerText = today.toLocaleDateString('vi-VN');
        document.getElementById('txDate').valueAsDate = today;
        document.getElementById('debtStartDate').valueAsDate = today;
        
        let nextMonth = new Date();
        nextMonth.setMonth(nextMonth.getMonth() + 1);
        document.getElementById('debtDueDate').valueAsDate = nextMonth;

        // Khởi tạo tháng
        function initMonthSelector() {
            const select = document.getElementById('filterMonthVN');
            let months = [];
            let currentYear = today.getFullYear();
            let currentMonth = today.getMonth() + 1;
            for(let i = 0; i < 12; i++) {
                let m = currentMonth - i;
                let y = currentYear;
                while(m <= 0) { m += 12; y -= 1; }
                months.push({val: `${y}-${String(m).padStart(2, '0')}`, label: `Tháng ${m} / ${y}`});
            }
            select.innerHTML = months.map(item => `<option value="${item.val}">${item.label}</option>`).join('');
            select.value = `${currentYear}-${String(currentMonth).padStart(2, '0')}`;
        }

        // Navigation
        function switchTab(tab) {
            ['transactions', 'debts', 'savings', 'settings'].forEach(t => {
                document.getElementById(`section-${t}`).classList.add('hidden');
                document.getElementById(`nav-${t}`).className = "flex flex-col items-center p-2 text-slate-500 transition-colors w-16";
            });
            document.getElementById(`section-${tab}`).classList.remove('hidden');
            
            let activeColor = 'text-blue-500';
            if(tab === 'debts') activeColor = 'text-amber-500';
            if(tab === 'savings') activeColor = 'text-emerald-500';
            if(tab === 'settings') activeColor = 'text-purple-500';
            
            document.getElementById(`nav-${tab}`).className = `flex flex-col items-center p-2 ${activeColor} transition-colors w-16 scale-110`;
            window.scrollTo(0, 0);
        }

        function formatMoney(amount) {
            if(isPrivate) return '****** đ';
            return Number(amount).toLocaleString('vi-VN') + ' đ';
        }

        function togglePrivacy() {
            isPrivate = !isPrivate;
            localStorage.setItem('vpro_privacy', isPrivate);
            document.getElementById('privacyIcon').className = isPrivate ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
            updateSummary();
            renderTransactions();
            renderDebts();
            renderSavings();
        }

        // THU CHI
        function addTransaction(e) {
            e.preventDefault();
            const tx = {
                id: Date.now(),
                type: document.getElementById('txType').value,
                amount: parseFloat(document.getElementById('txAmount').value),
                source: document.getElementById('txSource').value,
                date: document.getElementById('txDate').value,
                note: document.getElementById('txNote').value
            };
            transactions.unshift(tx);
            localStorage.setItem('vpro_tx', JSON.stringify(transactions));
            document.getElementById('txForm').reset();
            document.getElementById('txDate').valueAsDate = new Date();
            renderTransactions();
            updateSummary();
        }

        function renderTransactions() {
            const filterVal = document.getElementById('filterMonthVN').value;
            const listEl = document.getElementById('txList');
            const filtered = transactions.filter(t => !filterVal || t.date.startsWith(filterVal));

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="text-center text-xs text-slate-500 py-6 bg-slate-900 rounded-2xl border border-slate-800">Không có giao dịch</div>`;
                return;
            }
            listEl.innerHTML = filtered.map(t => `
                <div class="bg-slate-900 p-4 rounded-2xl shadow-sm border border-slate-800 flex justify-between items-center text-sm">
                    <div class="space-y-1">
                        <div class="font-black text-base ${t.type === 'income' ? 'text-emerald-400' : 'text-slate-100'}">
                            ${t.type === 'income' ? '+' : '-'} ${formatMoney(t.amount)}
                        </div>
                        <div class="text-xs text-slate-300 font-semibold">${t.source}</div>
                        <div class="text-[10px] text-slate-500 font-medium">${t.date.split('-').reverse().join('/')} ${t.note ? '• ' + t.note : ''}</div>
                    </div>
                    <button onclick="deleteTx(${t.id})" class="text-slate-600 hover:text-rose-400 p-2"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            `).join('');
        }
        function deleteTx(id) { if(confirm('Xóa?')) { transactions = transactions.filter(t => t.id !== id); localStorage.setItem('vpro_tx', JSON.stringify(transactions)); renderTransactions(); updateSummary(); } }

        function updateSummary() {
            let inAmt = 0, exAmt = 0;
            transactions.forEach(t => t.type === 'income' ? inAmt += t.amount : exAmt += t.amount);
            document.getElementById('totalIncome').innerText = formatMoney(inAmt);
            document.getElementById('totalExpense').innerText = formatMoney(exAmt);
            document.getElementById('totalBalance').innerText = formatMoney(inAmt - exAmt);
            document.getElementById('privacyIcon').className = isPrivate ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        }

        // CÔNG NỢ
        function addDebt(e) {
            e.preventDefault();
            const file = document.getElementById('debtImage').files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => saveDebt(e.target.result);
                reader.readAsDataURL(file);
            } else saveDebt(null);
        }
        function saveDebt(img) {
            debts.unshift({
                id: Date.now(), type: document.getElementById('debtType').value, amount: parseFloat(document.getElementById('debtAmount').value),
                person: document.getElementById('debtPerson').value, startDate: document.getElementById('debtStartDate').value, dueDate: document.getElementById('debtDueDate').value, status: 'pending', image: img
            });
            localStorage.setItem('vpro_debts', JSON.stringify(debts));
            document.getElementById('debtForm').reset();
            renderDebts();
        }
        function renderDebts() {
            const actEl = document.getElementById('activeDebtList'), compEl = document.getElementById('completedDebtList');
            const acts = debts.filter(d => d.status === 'pending'), comps = debts.filter(d => d.status === 'paid');
            actEl.innerHTML = acts.length ? acts.map(d => renderDebtItem(d)).join('') : `<div class="text-center text-xs text-slate-500 py-4 bg-slate-900 rounded-2xl border border-slate-800">Không có nợ</div>`;
            compEl.innerHTML = comps.length ? comps.map(d => renderDebtItem(d)).join('') : `<div class="text-center text-xs text-slate-500 py-4 bg-slate-950 rounded-2xl">Trống</div>`;
        }
        function renderDebtItem(d) {
            const isPaid = d.status === 'paid';
            return `<div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3 text-sm ${isPaid?'opacity-50':''}">
                <div class="flex justify-between"><div><span class="text-[10px] uppercase font-bold px-2 py-1 rounded-lg ${d.type==='lent'?'bg-blue-950 text-blue-400':'bg-purple-950 text-purple-400'}">${d.type==='lent'?'Cho mượn':'Đi mượn'}</span><h4 class="font-bold mt-1 text-slate-100">${d.person}</h4></div><span class="font-black text-slate-100">${formatMoney(d.amount)}</span></div>
                <div class="text-xs text-slate-400 flex justify-between pt-2 border-t border-slate-800"><span>Mượn: ${d.startDate}</span><span class="text-rose-400">Trả: ${d.dueDate}</span></div>
                ${d.image ? `<div class="pt-1"><img src="${d.image}" onclick="openImageModal('${d.image}')" class="w-12 h-12 rounded-xl object-cover cursor-pointer"></div>` : ''}
                <div class="flex justify-between items-center pt-2"><button onclick="toggleDebt(${d.id})" class="text-xs font-bold px-3 py-1.5 rounded-lg ${isPaid?'bg-emerald-500/20 text-emerald-400':'bg-amber-500/20 text-amber-400'}">${isPaid?'✅ Đã trả':'⏳ Đánh dấu trả'}</button><button onclick="deleteDebt(${d.id})" class="text-slate-600 p-1"><i class="fa-solid fa-trash-can"></i></button></div></div>`;
        }
        function toggleDebt(id) { debts.forEach(d => { if(d.id===id) d.status = d.status==='pending'?'paid':'pending'; }); localStorage.setItem('vpro_debts', JSON.stringify(debts)); renderDebts(); }
        function deleteDebt(id) { if(confirm('Xóa?')) { debts = debts.filter(d => d.id !== id); localStorage.setItem('vpro_debts', JSON.stringify(debts)); renderDebts(); } }
        
        // MỤC TIÊU TIẾT KIỆM
        function addSavingGoal(e) {
            e.preventDefault();
            savings.unshift({ id: Date.now(), name: document.getElementById('goalName').value, target: parseFloat(document.getElementById('goalTarget').value), current: parseFloat(document.getElementById('goalCurrent').value) });
            localStorage.setItem('vpro_savings', JSON.stringify(savings));
            document.getElementById('savingForm').reset();
            renderSavings();
        }
        function renderSavings() {
            const listEl = document.getElementById('savingList');
            listEl.innerHTML = savings.length ? savings.map(s => {
                let p = Math.min(100, Math.round((s.current/s.target)*100));
                return `<div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-2.5"><div class="flex justify-between items-center"><h4 class="font-bold text-sm text-slate-100">${s.name}</h4><button onclick="delSave(${s.id})" class="text-slate-600"><i class="fa-solid fa-trash-can"></i></button></div><div class="flex justify-between text-xs text-slate-400"><span>Đã có: <strong class="text-emerald-400">${formatMoney(s.current)}</strong></span><span>Đích: <strong>${formatMoney(s.target)}</strong> (${p}%)</span></div><div class="w-full bg-slate-950 h-2.5 rounded-full border border-slate-800"><div class="bg-emerald-500 h-full rounded-full" style="width: ${p}%"></div></div></div>`;
            }).join('') : `<div class="text-center text-xs text-slate-500 py-4">Chưa có mục tiêu</div>`;
        }
        function delSave(id) { savings = savings.filter(s => s.id !== id); localStorage.setItem('vpro_savings', JSON.stringify(savings)); renderSavings(); }

        // CÀI ĐẶT & BACKUP DỮ LIỆU
        function exportBackupData() {
            const data = { tx: transactions, debts: debts, savings: savings };
            const blob = new Blob([JSON.stringify(data)], {type: "application/json"});
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Vaultix_Backup_${new Date().toISOString().slice(0,10)}.json`;
            link.click();
        }
        function importBackupData(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = JSON.parse(evt.target.result);
                    if(data.tx) { transactions = data.tx; localStorage.setItem('vpro_tx', JSON.stringify(transactions)); }
                    if(data.debts) { debts = data.debts; localStorage.setItem('vpro_debts', JSON.stringify(debts)); }
                    if(data.savings) { savings = data.savings; localStorage.setItem('vpro_savings', JSON.stringify(savings)); }
                    alert('Khôi phục dữ liệu thành công!');
                    location.reload();
                } catch(err) { alert('File không hợp lệ!'); }
            };
            reader.readAsText(file);
        }
        function clearAllData() {
            if(confirm('CẢNH BÁO: Xóa toàn bộ lịch sử thu chi và nợ nần? Hành động này không thể hoàn tác!')) {
                localStorage.clear();
                location.reload();
            }
        }

        // Modal
        function openImageModal(src) { document.getElementById('modalImg').src = src; document.getElementById('imageModal').classList.remove('hidden'); }
        function closeImageModal() { document.getElementById('imageModal').classList.add('hidden'); }

        // Khởi chạy
        initMonthSelector(); updateSummary(); renderTransactions(); renderDebts(); renderSavings();
    </script>
</body>
</html>
